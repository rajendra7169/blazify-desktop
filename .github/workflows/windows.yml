# Builds the Windows installer.
#
# The packager embeds a platform's own Java runtime and drives that platform's
# installer tooling, so a Windows build has to happen on Windows — there is no
# cross-compile. Rather than keep a machine for it, one is borrowed here for the
# few minutes it takes, and the result is attached to the run.
name: Windows installer

on:
  push:
    branches: [main]
  # So it can be built on demand without pushing anything.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The packager shells out to WiX to assemble an installer and looks for
      # it on the path. The runner has it, but not where the packager looks.
      - name: Put WiX on the path
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset*' -Directory |
                 Select-Object -First 1
          if (-not $wix) { throw 'WiX is not on this runner' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The audio library is fetched once and cached, so later runs skip the
      # download entirely.
      - name: Cache the audio library
        uses: actions/cache@v4
        with:
          path: app/resources/windows
          key: windows-audio-vlc-3.0.21

      - name: Build
        shell: cmd
        run: gradlew.bat --no-daemon :app:packageExe :app:packageMsi

      - name: Attach the installers
        uses: actions/upload-artifact@v4
        with:
          name: blazify-windows
          path: |
            app/build/compose/binaries/main/exe/*.exe
            app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
