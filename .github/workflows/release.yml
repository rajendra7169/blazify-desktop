# Building the Linux package people actually install.
#
# Only Linux is built here. The Windows installer never touches GitHub, as a
# release asset or as a build artifact: it is built elsewhere and published on
# GitLab, which is where the website and the updater send Windows users.
name: Packages

on:
  # Cut a release by pushing a tag: git tag v1.0.1 && git push --tags
  push:
    tags: ["v*"]
  # And by hand, for testing the build itself without promising anything.
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The audio library is a dependency of the package rather than part of
      # it — a shared copy in the right place is smaller and more correct than
      # a private one — so it is needed to build and to run.
      - name: Fetch what the package declares
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc-plugin-base

      - name: Build the deb
        run: ./gradlew packageDeb --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: blazify-linux-deb
          path: app/build/compose/binaries/main/deb/*.deb

  # The Linux package on one page with a version number on it, which is what a
  # tester should be given rather than a link to a build log. The Windows
  # installer is never built or stored here: it is built elsewhere and
  # published on GitLab only.
  release:
    needs: [linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*
          draft: true
          generate_release_notes: true
